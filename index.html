<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>团队任务看板</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>团队任务看板</h1>
        <!-- 张鑫睿写的输入框部分 -->
        <div id="controls">
            <input type="text" id="task-input" placeholder="输入新任务...">
            <button onclick="addTask()">添加任务</button>
        </div>
    </header>
    <main class="board">
        <div class="column" id="todo" data-status="todo">
            <h2>待处理</h2>
            <div class="task-list" id="list-todo"></div>
        </div>
        <div class="column" id="doing" data-status="doing">
            <h2>进行中</h2>
            <div class="task-list" id="list-doing"></div>
        </div>
        <div class="column" id="done" data-status="done">
            <h2>已完成</h2>
            <div class="task-list" id="list-done"></div>
        </div>
    </main>
    <script src="app.js"></script>
</body>
</html>
